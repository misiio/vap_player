name: vap_player_ios
description: iOS implementation of flutter_vap_player.
version: 2.0.0
homepage: https://github.com/misiio/vap_player
repository: https://github.com/misiio/vap_player/tree/master/vap_player_ios

environment:
  sdk: ^3.10.4
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  vap_player_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    implements: flutter_vap_player
    platforms:
      ios:
        dartPluginClass: IosVapPlayer
        pluginClass: VapPlayerIosPlugin
